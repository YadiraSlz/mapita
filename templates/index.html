<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Mapa de Yadi 🌸</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <!-- Leaflet Routing Machine CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />

    <!-- FontAwesome para Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Fonts: Quicksand -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        /* CSS Reset y Estilos Base */
        body {
            height: 100dvh; 
            width: 100vw;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Quicksand', sans-serif;
        }

        #map {
            height: 100%;
            width: 100%;
            z-index: 0;
            background: #fdf2f8;
        }
        
        /* Ocultar panel nativo de Leaflet */
        .leaflet-routing-container { display: none !important; }

        .panel-transition {
            transition: height 0.4s cubic-bezier(0.25, 1, 0.5, 1), transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .custom-scroll {
            scrollbar-width: thin;
            scrollbar-color: #f472b6 transparent;
        }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb {
            background-color: #f472b6;
            border-radius: 10px;
        }

        input:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(236, 72, 153, 0.2);
            background-color: #fff;
        }
    </style>
</head>
<body class="bg-pink-50 flex flex-col md:flex-row">

    <!-- MAPA -->
    <main class="flex-1 relative h-full w-full order-1 md:order-2 z-0">
        <div id="map"></div>
        
        <!-- Botones Flotantes -->
        <div class="absolute top-4 right-4 md:bottom-8 md:right-8 z-[400] flex flex-col gap-3">
            <button onclick="locateUser()" class="bg-white w-11 h-11 md:w-14 md:h-14 rounded-full shadow-lg shadow-pink-100 hover:bg-pink-50 active:bg-pink-100 text-pink-500 flex items-center justify-center text-xl transition-all active:scale-95 border-2 border-white" title="Mi Ubicación">
                <i class="fa-solid fa-location-arrow"></i>
            </button>

            <button onclick="centerMap()" class="bg-white w-11 h-11 md:w-14 md:h-14 rounded-full shadow-lg shadow-pink-100 hover:bg-pink-50 active:bg-pink-100 text-gray-600 flex items-center justify-center text-xl transition-all active:scale-95 border-2 border-white" title="Ver Tijuana">
                <i class="fa-solid fa-city"></i>
            </button>
        </div>
    </main>

    <!-- PANEL LATERAL / INFERIOR -->
    <aside id="sidebar" class="bg-white/95 backdrop-blur-sm shadow-[0_-5px_25px_-5px_rgba(0,0,0,0.1)] z-[1000] flex flex-col order-2 md:order-1 w-full md:w-[400px] panel-transition rounded-t-3xl md:rounded-none border-r border-pink-100">
        
        <!-- HEADER -->
        <div class="p-4 bg-gradient-to-r from-pink-500 to-rose-400 text-white flex justify-between items-center shrink-0 cursor-pointer md:cursor-default relative md:rounded-br-3xl shadow-lg shadow-pink-200" onclick="toggleMobilePanel()">
            <div class="absolute -top-3 left-0 right-0 h-6 flex justify-center md:hidden pointer-events-none">
                <div class="w-12 h-1.5 bg-white/80 rounded-full shadow-sm backdrop-blur-md"></div>
            </div>

            <div class="flex flex-col">
                <h1 class="text-xl md:text-2xl font-bold flex items-center gap-2 tracking-tight">
                    <i class="fa-solid fa-heart text-pink-200"></i> 
                    <span>Mapa de Yadi</span>
                </h1>
                <p class="text-xs text-pink-100 font-medium ml-1">Explorando Tijuana</p>
            </div>
            
            <button id="toggle-btn" class="md:hidden text-white focus:outline-none p-2 rounded-full hover:bg-white/20 transition-colors">
                <i class="fa-solid fa-chevron-up transition-transform duration-300" id="toggle-icon"></i>
            </button>
        </div>

        <!-- CONTENIDO DEL PANEL -->
        <div id="panel-content" class="flex flex-col flex-1 overflow-hidden bg-white md:bg-transparent">
            
            <!-- Inputs de Ruta -->
            <div class="p-4 space-y-3 border-b border-pink-50 shrink-0 bg-white/50">
                
                <!-- Input Inicio -->
                <div class="relative group">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fa-regular fa-circle text-pink-400 group-focus-within:text-pink-600 text-xs"></i>
                    </div>
                    <input type="text" id="start-input" placeholder="¿Dónde estás?" 
                           class="w-full pl-9 pr-10 py-2.5 rounded-2xl border-2 border-pink-100 bg-pink-50/30 text-gray-700 placeholder-pink-300 focus:border-pink-400 transition-all text-sm font-semibold shadow-sm"
                           onkeypress="handleSearch(event, 'start')">
                    <button onclick="searchLocation('start')" class="absolute inset-y-0 right-0 pr-3 flex items-center text-pink-300 hover:text-pink-600 cursor-pointer transition-colors" title="Buscar inicio">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
                </div>

                <!-- Línea conectora visual -->
                <div class="absolute left-7 top-[78px] h-6 w-0.5 bg-pink-200 hidden md:block z-0 pointer-events-none opacity-50"></div>

                <!-- Input Destino -->
                <div class="relative group">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fa-solid fa-location-dot text-rose-500 group-focus-within:text-rose-600 text-sm"></i>
                    </div>
                    <input type="text" id="end-input" placeholder="¿A dónde vamos?" 
                           class="w-full pl-9 pr-10 py-2.5 rounded-2xl border-2 border-pink-100 bg-pink-50/30 text-gray-700 placeholder-pink-300 focus:border-pink-400 transition-all text-sm font-semibold shadow-sm"
                           onkeypress="handleSearch(event, 'end')">
                    <button onclick="searchLocation('end')" class="absolute inset-y-0 right-0 pr-3 flex items-center text-pink-300 hover:text-pink-600 cursor-pointer transition-colors" title="Buscar destino">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
                </div>

                <!-- Botones de Acción -->
                <div class="grid grid-cols-2 gap-3 pt-1">
                    <button onclick="resetMap()" class="group bg-white hover:bg-gray-50 text-gray-500 py-2 px-4 rounded-xl transition border border-gray-100 flex items-center justify-center gap-2 text-xs font-bold shadow-sm hover:shadow active:scale-95">
                        <i class="fa-regular fa-trash-can group-hover:text-pink-400"></i> Limpiar
                    </button>
                    <button onclick="exportRoute()" id="btn-export" disabled class="bg-gradient-to-r from-pink-500 to-rose-400 hover:from-pink-600 hover:to-rose-500 text-white py-2 px-4 rounded-xl transition opacity-50 cursor-not-allowed flex items-center justify-center gap-2 text-xs font-bold shadow-lg shadow-pink-200 active:scale-95">
                        <i class="fa-solid fa-cloud-arrow-down"></i> <span class="truncate">Guardar Ruta</span>
                    </button>
                </div>
                
                <!-- Status bar pequeño -->
                <div class="text-[10px] text-center text-pink-400 font-medium truncate px-2" id="status-text">
                    Toca el mapa o busca para comenzar ✨
                </div>
            </div>

            <!-- Lista de Instrucciones -->
            <div class="flex-1 overflow-y-auto p-4 custom-scroll relative bg-white" id="instructions-panel">
                <div class="absolute inset-0 flex flex-col items-center justify-center text-center p-6 opacity-60">
                    <img src="https://cdn-icons-png.flaticon.com/512/263/263115.png" alt="Map Icon" class="w-20 h-20 mb-4 opacity-50 grayscale hover:grayscale-0 transition-all duration-500">
                    <p class="text-pink-300 font-bold text-lg">¿Lista para irnos?</p>
                    <p class="text-xs text-gray-400 mt-1">Ingresa inicio y destino arriba</p>
                </div>
            </div>
            
            <div class="p-2 text-center text-[10px] text-pink-300 bg-white border-t border-pink-50">
                Hecho con 💖 para Yadi
            </div>
        </div>
    </aside>

    <!-- SCRIPTS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>

    <script>
        const TJ_COORDS = [32.5149, -117.0382];
        let map;
        let routingControl = null;
        
        // Estado de Puntos y Marcadores
        let startPoint = null;
        let startMarker = null;
        
        let endPoint = null;
        let endMarker = null;
        
        // UI State
        let isMobilePanelExpanded = false;
        const sidebar = document.getElementById('sidebar');
        const toggleIcon = document.getElementById('toggle-icon');

        const MOBILE_COLLAPSED_HEIGHT = '90px'; // Un poco más alto por el header
        const MOBILE_EXPANDED_HEIGHT = '70vh';  // Más espacio para ver inputs

        window.onload = function() {
            initMap();
            applyResponsiveLayout();
            window.addEventListener('resize', applyResponsiveLayout);
        };

        function initMap() {
            map = L.map('map', {
                zoomControl: false,
                tap: false
            }).setView(TJ_COORDS, 13);

            L.control.zoom({ position: 'topleft' }).addTo(map);

            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OpenStreetMap &copy; CARTO',
                maxZoom: 20
            }).addTo(map);

            map.on('click', onMapClick);
        }

        // --- BÚSQUEDA ---

        function handleSearch(event, type) {
            if (event.key === 'Enter') {
                searchLocation(type);
            }
        }

        async function searchLocation(type) {
            const inputId = type === 'start' ? 'start-input' : 'end-input';
            const query = document.getElementById(inputId).value;
            
            if(!query) return;
            
            // Efecto visual de carga
            const btn = document.querySelector(`button[onclick="searchLocation('${type}')"] i`);
            const originalIcon = btn.className;
            btn.className = 'fa-solid fa-spinner fa-spin';

            try {
                const response = await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(query + ' Tijuana Mexico')}&limit=1`);
                if (!response.ok) throw new Error('Network error');
                const data = await response.json();

                if(data && data.features && data.features.length > 0) {
                    const feature = data.features[0];
                    const lat = feature.geometry.coordinates[1];
                    const lon = feature.geometry.coordinates[0];
                    const latlng = L.latLng(lat, lon);
                    const name = feature.properties.name || query;

                    map.flyTo(latlng, 15);

                    // Actualizar el punto correspondiente
                    if (type === 'start') {
                        setStartPoint(latlng, name); // Mantiene el nombre buscado
                    } else {
                        setEndPoint(latlng, name);
                    }
                    
                    // Colapsar panel en móvil si ya se completó una acción importante
                    if(window.innerWidth < 768 && startPoint && endPoint) {
                        isMobilePanelExpanded = true; toggleMobilePanel(); // Para que el usuario vea el mapa
                    }
                } else {
                    updateStatus("🤷‍♀️ No encontré ese lugar. Intenta otro nombre.");
                }
            } catch (e) {
                console.error(e);
                updateStatus("❌ Error al buscar.");
            } finally {
                btn.className = originalIcon;
            }
        }

        // --- GEOLOCALIZACIÓN ---

        function locateUser() {
            if (!navigator.geolocation) {
                updateStatus("🚫 Sin acceso a ubicación.");
                return;
            }
            
            updateStatus("📍 Buscándote...");
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const latlng = L.latLng(position.coords.latitude, position.coords.longitude);
                    map.flyTo(latlng, 16);
                    
                    // Usar como Inicio automáticamente
                    setStartPoint(latlng, "✨ Mi Ubicación actual");
                },
                () => updateStatus("🔒 Permiso de ubicación denegado.")
            );
        }

        // --- LÓGICA DE MAPA Y PUNTOS ---

        function onMapClick(e) {
            // Lógica inteligente: Si falta inicio, pon inicio. Si hay inicio pero falta fin, pon fin.
            // Si hay ambos, asume que el usuario quiere cambiar el Destino (caso común).
            
            if (!startPoint) {
                setStartPoint(e.latlng, "📍 Ubicación seleccionada");
            } else if (!endPoint) {
                setEndPoint(e.latlng, "📍 Ubicación seleccionada");
            } else {
                // Si ya hay ruta, cambiamos el destino por defecto
                setEndPoint(e.latlng, "📍 Ubicación seleccionada");
            }
        }

        function setStartPoint(latlng, text = null) {
            startPoint = latlng;
            
            // Eliminar marcador anterior si existe
            if (startMarker) map.removeLayer(startMarker);
            
            // Crear nuevo marcador visual
            startMarker = L.marker(startPoint, {
                icon: L.divIcon({
                    className: 'bg-transparent',
                    html: `
                        <div class="relative group">
                            <i class="fa-solid fa-location-dot text-rose-500 text-4xl drop-shadow-md stroke-white" style="-webkit-text-stroke: 1px white;"></i>
                            <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-full mt-[-8px]">
                                <i class="fa-regular fa-circle text-white text-[10px]"></i>
                            </div>
                        </div>`,
                    iconSize: [35, 35],
                    iconAnchor: [17, 35]
                })
            }).addTo(map);

            // Actualizar input solo si se provee texto (no sobrescribir si el usuario está escribiendo)
            if(text) document.getElementById('start-input').value = text;
            
            checkAndCalculateRoute();
        }

        function setEndPoint(latlng, text = null) {
            endPoint = latlng;
            
            if (endMarker) map.removeLayer(endMarker);
            
            endMarker = L.marker(endPoint, {
                icon: L.divIcon({
                    className: 'bg-transparent',
                    html: `
                        <div class="relative group">
                            <i class="fa-solid fa-location-dot text-rose-600 text-4xl drop-shadow-md stroke-white" style="-webkit-text-stroke: 1px white;"></i>
                            <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-full mt-[-8px]">
                                <i class="fa-solid fa-flag-checkered text-white text-[10px]"></i>
                            </div>
                        </div>`,
                    iconSize: [35, 35],
                    iconAnchor: [17, 35]
                })
            }).addTo(map);

            if(text) document.getElementById('end-input').value = text;
            
            checkAndCalculateRoute();
        }

        function checkAndCalculateRoute() {
            // Calcular solo si ambos puntos existen
            if (startPoint && endPoint) {
                calculateRoute();
            } else if (startPoint) {
                updateStatus("Ahora selecciona el <strong>Destino</strong>");
            }
        }

        function calculateRoute() {
            // Limpiar ruta previa pero NO los marcadores de input (esos los maneja Leaflet Routing Machine internamente o los reemplaza)
            // LRM dibuja sus propios marcadores. Para evitar duplicados, ocultamos los nuestros temporales
            if (startMarker) map.removeLayer(startMarker);
            if (endMarker) map.removeLayer(endMarker);
            
            if (routingControl) map.removeControl(routingControl);

            updateStatus("💖 Calculando ruta...");

            routingControl = L.Routing.control({
                waypoints: [
                    L.latLng(startPoint.lat, startPoint.lng),
                    L.latLng(endPoint.lat, endPoint.lng)
                ],
                routeWhileDragging: false,
                showAlternatives: false,
                language: 'es',
                lineOptions: {
                    styles: [{color: '#ec4899', opacity: 0.8, weight: 6, className: 'animate-pulse'}]
                },
                createGeocoder: function() { return null; },
                addWaypoints: false,
                draggableWaypoints: false,
                fitSelectedRoutes: true,
                // Personalizar marcadores de la ruta final
                createMarker: function(i, wp, nWps) {
                    const isStart = i === 0;
                    return L.marker(wp.latLng, {
                        icon: L.divIcon({
                            className: 'bg-transparent',
                            html: isStart ? 
                                `<i class="fa-solid fa-location-dot text-rose-500 text-4xl drop-shadow-md"></i>` :
                                `<i class="fa-solid fa-location-dot text-rose-600 text-4xl drop-shadow-md"><i class="fa-solid fa-flag-checkered text-white text-[10px] absolute top-1 left-2.5"></i></i>`,
                            iconSize: [35, 35],
                            iconAnchor: [17, 35]
                        })
                    });
                }
            }).addTo(map);

            routingControl.on('routesfound', function(e) {
                const routes = e.routes;
                const summary = routes[0].summary;
                const min = Math.round(summary.totalTime / 60);
                const km = (summary.totalDistance / 1000).toFixed(1);
                
                updateStatus(`✨ <strong>${min} min</strong> (${km} km)`);
                
                const btn = document.getElementById('btn-export');
                btn.disabled = false;
                btn.classList.remove('opacity-50', 'cursor-not-allowed');

                renderInstructions(routes[0].instructions);
                
                // Abrir panel en móvil si está cerrado para ver detalles
                if (window.innerWidth < 768 && !isMobilePanelExpanded) toggleMobilePanel();
            });
            
            // Ocultar cuadro nativo
            setTimeout(() => {
                const lrm = document.querySelector('.leaflet-routing-container');
                if(lrm) lrm.style.display = 'none';
            }, 50);
        }

        function renderInstructions(instructions) {
            const panel = document.getElementById('instructions-panel');
            panel.innerHTML = ''; 
            const ul = document.createElement('ul');
            ul.className = 'space-y-3 pb-4';

            instructions.forEach((instr, i) => {
                const li = document.createElement('li');
                li.className = 'flex items-start gap-3 p-3 bg-pink-50/40 rounded-2xl border border-pink-100 hover:bg-pink-100 transition-colors';
                
                let icon = 'fa-arrow-up';
                let color = 'text-pink-400';
                const txt = instr.text.toLowerCase();

                if (txt.includes('izquierda')) { icon = 'fa-arrow-turn-up fa-rotate-270'; color = 'text-fuchsia-500'; }
                else if (txt.includes('derecha')) { icon = 'fa-arrow-turn-up fa-rotate-90'; color = 'text-fuchsia-500'; }
                else if (txt.includes('rotonda')) { icon = 'fa-arrows-spin'; color = 'text-violet-500'; }
                else if (txt.includes('llegado') || instr.type === 'DestinationReached') { icon = 'fa-star'; color = 'text-yellow-400'; }
                
                li.innerHTML = `
                    <div class="mt-1 w-7 h-7 rounded-full bg-white flex items-center justify-center shadow-sm shrink-0 ${color}">
                        <i class="fa-solid ${icon} text-xs"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="text-xs md:text-sm text-gray-700 leading-tight font-medium py-1">${instr.text}</div>
                        <div class="text-[10px] text-pink-400 font-bold">
                            ${i === instructions.length-1 ? '¡Llegaste!' : (instr.distance < 1000 ? Math.round(instr.distance)+'m' : (instr.distance/1000).toFixed(1)+'km')}
                        </div>
                    </div>
                `;
                ul.appendChild(li);
            });
            panel.appendChild(ul);
        }

        // --- UTILIDADES ---

        function updateStatus(html) {
            document.getElementById('status-text').innerHTML = html;
        }

        function resetMap() {
            startPoint = null; endPoint = null;
            startMarker = null; endMarker = null;
            
            document.getElementById('start-input').value = '';
            document.getElementById('end-input').value = '';
            
            if (routingControl) {
                map.removeControl(routingControl);
                routingControl = null;
            }

            map.eachLayer((layer) => {
                if (layer instanceof L.Marker || layer instanceof L.CircleMarker) {
                    map.removeLayer(layer);
                }
            });
            
            document.getElementById('instructions-panel').innerHTML = `
                <div class="absolute inset-0 flex flex-col items-center justify-center text-center p-6 opacity-60">
                    <img src="https://cdn-icons-png.flaticon.com/512/263/263115.png" alt="Map Icon" class="w-20 h-20 mb-4 opacity-50 grayscale hover:grayscale-0 transition-all duration-500">
                    <p class="text-pink-300 font-bold text-lg">¿Lista para irnos?</p>
                    <p class="text-xs text-gray-400 mt-1">Ingresa inicio y destino arriba</p>
                </div>
            `;
            
            const btn = document.getElementById('btn-export');
            btn.disabled = true;
            btn.classList.add('opacity-50', 'cursor-not-allowed');

            updateStatus("¡Mapa limpio! ✨");
            map.flyTo(TJ_COORDS, 13);
        }

        function centerMap() { map.flyTo(TJ_COORDS, 13); }
        function exportRoute() { /* Misma lógica anterior */ 
            if (!routingControl || !routingControl._routes) return;
            try {
                const route = routingControl._routes[0];
                const geoJSON = { "type": "FeatureCollection", "features": [{ "type": "Feature", "properties": { "name": "Ruta Yadi", "created_at": new Date() }, "geometry": { "type": "LineString", "coordinates": route.coordinates.map(c => [c.lng, c.lat]) } }] };
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(geoJSON));
                const a = document.createElement('a');
                a.href = dataStr; a.download = `ruta_yadi_${Date.now()}.geojson`;
                a.click();
            } catch (error) { alert("Error al guardar la ruta :("); }
        }

        // --- RESPONSIVE ---
        function applyResponsiveLayout() {
            const isDesktop = window.innerWidth >= 768;
            if (isDesktop) {
                sidebar.style.height = '100%';
                toggleIcon.style.display = 'none';
            } else {
                toggleIcon.style.display = 'block';
                sidebar.style.height = isMobilePanelExpanded ? MOBILE_EXPANDED_HEIGHT : MOBILE_COLLAPSED_HEIGHT;
            }
            setTimeout(() => { if(map) map.invalidateSize(); }, 300);
        }

        function toggleMobilePanel() {
            if (window.innerWidth >= 768) return;
            isMobilePanelExpanded = !isMobilePanelExpanded;
            sidebar.style.height = isMobilePanelExpanded ? MOBILE_EXPANDED_HEIGHT : MOBILE_COLLAPSED_HEIGHT;
            toggleIcon.className = isMobilePanelExpanded ? 
                'fa-solid fa-chevron-down transition-transform duration-300' : 
                'fa-solid fa-chevron-up transition-transform duration-300';
        }
    </script>
</body>
</html>
